<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Sem CDN: tudo local. CSP bloqueia qualquer carregamento remoto. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' file:; img-src 'self' file: data: https://m.media-amazon.com; style-src 'self' file: 'unsafe-inline'; script-src 'self' file: 'unsafe-eval'; connect-src 'none'">
  <title>Restock</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
  <script defer src="vendor/alpine.min.js"></script>
</head>
<body class="h-full bg-slate-950 text-slate-100" x-data="shell" x-cloak>
  <div class="flex h-screen">
    <aside class="w-56 shrink-0 border-r border-slate-800 bg-slate-900 flex flex-col">
      <div class="px-4 py-4 flex items-center justify-between border-b border-slate-800">
        <span class="font-semibold tracking-wide">Restock</span>
        <button class="text-slate-400 hover:text-white" title="Bloquear" @click="lock()">🔒</button>
      </div>
      <nav class="flex-1 py-2">
        <template x-for="item in nav" :key="item.id">
          <button class="w-full text-left px-4 py-2 text-sm hover:bg-slate-800"
                  :class="tela === item.id ? 'bg-slate-800 text-white font-medium' : 'text-slate-300'"
                  @click="tela = item.id" x-text="item.label"></button>
        </template>
      </nav>
      <div class="px-4 py-3 text-xs text-slate-500 border-t border-slate-800">
        v<span x-text="versao"></span> · <span x-text="ponte ? 'motor conectado' : 'aguardando ponte…'"></span>
      </div>
    </aside>

    <main class="flex-1 overflow-auto p-6">
      <h1 class="text-xl font-semibold mb-4" x-text="nav.find(n => n.id === tela)?.label"></h1>
      <div class="rounded-lg border border-dashed border-slate-700 p-8 text-slate-400 text-sm">
        Tela em construção (etapa A1: scaffold).
      </div>
    </main>
  </div>
</body>
</html>
